<style>
:root{--red:#a02020;--dk:#5e1414;--tint:#fbefef;--line:#e6d5d6}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Calibri,Arial,sans-serif;margin:0;background:#faf6f4;color:#2a2325}
header{background:#fff;border-bottom:4px solid var(--red);padding:8px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px #0001;position:sticky;top:0;z-index:5}
header img{height:42px;width:auto;max-width:170px;object-fit:contain}header h1{font-size:18px;margin:0 auto 0 8px;color:var(--red)}
select,button,input,.btn{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid #d9c4c6;background:#fff;color:#2a2325;transition:.15s}
button,.btn{cursor:pointer}button:hover,.btn:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px)}
button.on,.btn.p{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}button.on:hover,.btn.p:hover{color:#fff;opacity:.92}
main{max-width:1000px;margin:16px auto;padding:0 14px;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.box{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h2{background:linear-gradient(90deg,var(--red),var(--dk));color:#fff;margin:-14px -14px 12px;padding:9px 14px;font-size:15px;border-radius:12px 12px 0 0}
.ks{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.k{background:var(--tint);border-top:3px solid var(--red);border-radius:8px;padding:8px 14px;min-width:112px;text-align:center;flex:1}
.k b{display:block;font-size:24px;color:var(--red)}.k small{display:block;color:#7a6a6c;font-size:11px}
table{border-collapse:collapse;width:100%;font-size:13px}th{background:#f4e3e4;color:var(--dk)}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:center}td:first-child,th:first-child{text-align:left}
tr:nth-child(even) td{background:#fdf8f7}
.g{color:#1e7b34;font-weight:bold}.r{color:#c00000;font-weight:bold}.subpct{display:block;color:#7a6a6c;font-size:11px;margin-top:2px}
.hero{text-align:center;padding:30px 10px 10px}.hero img{height:96px}.hero h1{font-size:34px;margin:14px 0 4px;color:var(--red)}.hero p{color:#7a6a6c;font-size:16px;margin:0 0 20px}
.dz{border:3px dashed var(--red);background:#fff;border-radius:18px;padding:40px 20px;cursor:pointer;transition:.2s;max-width:640px;margin:0 auto;text-align:center}.dz:hover{background:var(--tint);transform:scale(1.01)}
.dz b{font-size:20px;color:var(--red);display:block;margin:6px 0}.dz span{font-size:46px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}.chip{background:#fff;border-radius:999px;padding:7px 16px;box-shadow:0 1px 4px #0002;font-size:13px}
.cards{display:flex;gap:10px;flex-wrap:wrap}
body.drop::after{content:'Drop your file to import';position:fixed;inset:0;background:#a02020e6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;z-index:99}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:100;pointer-events:none}#toast.s{opacity:1}
#pv{display:none}body.pvo #pv{display:block;background:#e9e2df;min-height:100vh;padding:0 12px}body.pvo header,body.pvo main{display:none}
.pvbar{max-width:794px;margin:0 auto;padding:14px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet{max-width:794px;margin:0 auto 24px;background:#fff;padding:18px;border-top:8px solid var(--red);box-shadow:0 6px 24px #0003;border-radius:4px}.sheet .no{display:none}
@media print{@page{size:A4;margin:10mm}body{background:#fff}header,.no,.pvbar{display:none}body.pvo #pv{background:#fff;padding:0}.sheet{padding:0;max-width:none;box-shadow:none;border-top:6px solid var(--red)}.box{box-shadow:none;break-inside:avoid}}

const grade=p=>p==null?'–':G.filter(g=>p>=g[0]).pop()[1];
const ord=n=>n+(n%100>10&&n%100<14?'th':['th','st','nd','rd'][n%10>3?0:n%10]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=v=>v==null?'–':(v*100).toFixed(1)+'%';
const $=id=>document.getElementById(id);
const sum=a=>a.reduce((x,y)=>x+y,0);

const BRAND_LOGO='manisy-logo.png';

const subjectLabel=(n,p)=>`<div>${esc(n)}</div><small class=subpct>${pc(p)}</small>`;

function calc(a){const r=a.st.map(s=>{let t=0,o=0,c=0;s.k.forEach((v,i)=>{if(typeof v=='number'){t+=v;o+=a.subs[i].m;c++}});return{s,t,o,c,p:c?t/o:null}});
 const v=r.filter(x=>x.p!=null).map(x=>x.p);
 r.forEach(x=>{if(x.p!=null){const b=v.filter(y=>y<x.p-1e-9).length,e=v.filter(y=>Math.abs(y-x.p)<1e-9).length;x.rank=1+v.filter(y=>y>x.p+1e-9).length;x.ah=b;x.pc=(b+e/2)/v.length}});
 r.n=v.length;r.avg=sum(v)/(v.length||1);r.hi=v.length?Math.max(...v):null;return r}
function subj(a,x){return a.subs.map((s,i)=>{const c=a.st.map(t=>t.k[i]).filter(v=>typeof v=='number'),v=x.s.k[i],ok=typeof v=='number';
 return{n:s.n,m:s.m,v:ok?v:null,p:ok?v/s.m:null,avg:c.length?sum(c)/c.length/s.m:null,hi:c.length?Math.max(...c)/s.m:null,rk:ok?1+c.filter(y=>y>v).length:null,N:c.length}})}

const sl=l=>l.length>10?l.slice(0,9)+"…":l;
function bars(L,S,C,names){const w=560,h=190,bw=w/L.length;let s=`<svg font-family="Segoe UI,Calibri,Arial,sans-serif" viewBox="0 -14 ${w} ${h+44}" style="width:100%;max-width:720px;display:block;margin:auto;overflow:visible">`;
 [0,.5,1].forEach(g=>s+=`<line x1=24 x2=${w} y1=${h-g*h} y2=${h-g*h} stroke="#ddd"/><text x=0 y=${h-g*h-2} font-size=9>${g*100}%</text>`);
 L.forEach((l,i)=>{S.forEach((a,j)=>{const v=a[i]||0,k=bw*.8/S.length;s+=`<rect x=${i*bw+bw*.1+j*k+12} y=${h-v*h} width=${k-1} height=${v*h} fill="${C[j]}"/>`});
  s+=`<text x=${i*bw+bw/2+12} y=${h+14} font-size=10 text-anchor=middle>${esc(sl(l))}</text>`});
 return s+'</svg>'+(names?`<small>${names.map((n,j)=>`<span style="color:${C[j]}">■</span> ${n}`).join(' &nbsp; ')}</small>`:'')}

const toast=(m,keep)=>{const t=$('toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.h);if(!keep)toast.h=setTimeout(()=>t.classList.remove('s'),4500)};
const open2=(c,i)=>{cls=Object.keys(DB)[c];ai=i;tab='s';view='app';render()};
function demo(){const S=['English','Urdu','Math','Science','Computer Science','Islamiat'],M=[30,25,25,15,25,25],
 N=['Ayesha Khan','Bilal Ahmed','Hira Malik','Usman Tariq','Zainab Ali','Hamza Sheikh','Maryam Noor','Daniyal Raza','Sana Iqbal','Omar Farooq','Laiba Shah','Ahsan Javed'],
 mk=(nm,z)=>({name:nm,subs:S.map((n,i)=>({n,m:M[i]})),st:N.map((n,si)=>({n,k:S.map((_,i)=>{const r=Math.abs(Math.sin((si+1)*(i+3)*z))*.45+.5+(si%4)*.04;return si==5&&i>3?null:Math.min(M[i],Math.round(r*M[i]))})}))});
 DB['Demo Class']=[mk('September',1.3),mk('October',2.1)];cls='Demo Class';ai=0;tab='s';view='app';save();render();toast('Sample data loaded - fictional students')}
function home(){const cl=Object.keys(DB);
 $('main').innerHTML=`<div class=hero><img src="${BRAND_LOGO}"><h1>Welcome to Manisy Dashboards</h1><p>Import your data and get dashboards that adapt to its structure.</p></div>
 <div class=dz onclick="$('f').click()"><span>📂</span><b>Drag &amp; drop a file here</b><small>We detect tables and fields from supported documents automatically.</small><b style="display:none"></b><small>or click to choose any file · one file per assessment</small></div>
 <p style="text-align:center;margin:16px 0 0"><button onclick="demo()">✨ Try with sample data</button></p><p style="text-align:center;color:#7a6a6c;font-size:12px">🔒 Files are processed on this device only - nothing is uploaded.</p>
 <div class=chips><span class=chip>📊 Monthly dashboards</span><span class=chip>📈 Combined progress report</span><span class=chip>🖨️ Print-ready reports</span></div>
 ${cl.length?`<div class=box><b>Continue where you left off</b><div class=cards style="margin-top:10px">${cl.map((c,ci)=>DB[c].map((a,i)=>`<button onclick="open2(${ci},${i})">${esc(c)} · ${esc(a.name)}</button>`).join('')).join('')}</div></div>`:''}`}
const chart=bars;
const cpv=()=>{document.body.classList.remove('pvo');$('pv').innerHTML=''};
function pv(){const as=DB[cls];if(!as)return;const a=as[ai];
 $('pv').innerHTML=`<div class=pvbar><button class=on onclick="window.print()">Print</button><button onclick="cpv()">Close preview</button><small>This is the printed page. In the print window you can pick a printer or "Save as PDF".</small></div><div class=sheet>${$('main').innerHTML}</div>`;
 document.body.classList.add('pvo');scrollTo(0,0)}
const clean=t=>String(t).replace(/[\\/:*?"<>|]/g,'').trim();
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),9e3)};
async function mk(box){const pdf=new jspdf.jsPDF('p','mm','a4');let y=10,first=1;
 for(const el of [...box.children]){const cv=await html2canvas(el,{scale:1.5,backgroundColor:'#fff'}),h=cv.height*190/cv.width;
  if(y+h>287&&!first){pdf.addPage();y=10}first=0;pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',10,y,190,h);y+=h+4}
 return pdf.output('arraybuffer')}
async function genPDFs(c,names){if(!DB[c])return toast('Import a marks file first');
 if(!(window.jspdf&&window.html2canvas&&window.JSZip))return toast('PDF tools not loaded - check your installation');
 const oc=cls,os=sn,A=DB[c],zip=new JSZip(),jobs=[];
 A.forEach(a=>{if(names.includes(a.name))a.st.forEach(s=>jobs.push({n:s.n,t:a.name+' Result',a}))});
 if(A.length>1)[...new Set(A.flatMap(a=>a.st.map(s=>s.n)))].forEach(n=>jobs.push({n,t:'Combined Result ('+A.map(a=>a.name).join(', ')+')',comb:1}));
 const box=document.createElement('div');box.style.cssText='position:absolute;left:-10000px;top:0;width:794px;background:#fff;padding:18px';document.body.append(box);
 try{cls=c;for(let k=0;k<jobs.length;k++){const j=jobs[k];sn=j.n;box.innerHTML=j.comb?combView(1):stuView(j.a,calc(j.a));
  toast('Creating PDFs '+(k+1)+' / '+jobs.length+' ...',1);await new Promise(r=>setTimeout(r,20));
  zip.folder(clean(c)).folder(clean(j.n)).file(clean(j.n+' - '+j.t)+'.pdf',await mk(box))}
  dl(await zip.generateAsync({type:'blob'}),clean(c)+' PDFs.zip');toast('Done - '+jobs.length+' PDFs saved in "'+clean(c)+' PDFs.zip"')}
 catch(e){toast('PDF creation failed: '+e)}finally{box.remove();cls=oc;sn=os}}
function stuView(A,R){const x=R.find(r=>r.s.n==sn);if(!x)return'<div class=box>This student is not in this assessment.</div>';
 const sb=subj(A,x),d=x.p!=null&&R.avg?(x.p-R.avg)*100:null,ok=sb.filter(s=>s.p!=null);
 const best=ok.length?ok.reduce((a,b)=>b.p>a.p?b:a):null,low=ok.length?ok.reduce((a,b)=>b.p<a.p?b:a):null;
 const ab=sb.filter(s=>s.p==null).map(s=>s.n).join(', ')||'None';
 return hd(A.name,A)+`<div class=box><h2>① Standing in class</h2><div class=ks>
 ${kp('Class position',x.rank?ord(x.rank):'Not ranked','of '+R.n+' students')}${kp('Overall %',pc(x.p),x.c?x.t+' / '+x.o+' marks':'absent in all')}
 ${kp('Class average',pc(R.avg))}${kp('vs average',d==null?'–':(d>=0?'+':'')+d.toFixed(1)+' pts','')}${kp('Class highest',pc(R.hi))}</div>
 ${tb(['Subject','Marks','Out of','Class avg %','Highest %','Subject rank'],sb.map(s=>[subjectLabel(s.n,s.p),s.v==null?'Absent':s.v,s.m,
  pc(s.avg),pc(s.hi),s.rk?s.rk+' of '+s.N:'–']))}
 ${chart(sb.map(s=>s.n),[sb.map(s=>s.p),sb.map(s=>s.avg),sb.map(s=>s.hi)],['#a02020','#a5a5a5','#70ad47'],['Student','Class average','Highest'])}</div>
 <div class=box><h2>② Overall result &amp; percentile</h2><div class=ks>
 ${kp('Total marks',x.c?x.t:'–',x.c?'out of '+x.o:'')}${kp('Overall %',pc(x.p))}${kp('Grade',grade(x.p))}${kp('Percentile',x.pc!=null?ord(Math.round(x.pc*100)):'–','higher is better')}</div>
 <svg viewBox="0 0 560 44" width="100%"><rect x=10 y=14 width=540 height=12 rx=6 fill="#f0dcdd"/>${x.pc!=null?`<circle cx=${10+540*x.pc} cy=20 r=9 fill="#5e1414"/>`:''}<text x=10 y=42 font-size=10>lowest in class</text><text x=550 y=42 font-size=10 text-anchor=end>highest in class</text></svg>
 ${tb(['Item','Value'],[['Ahead of',x.ah!=null?x.ah+' of '+(R.n-1)+' classmates':'–'],['Subjects sat',x.c+' of '+A.subs.length],['Absent in',esc(ab)],
  ['Strongest subject',best?esc(best.n)+' ('+pc(best.p)+')':'–'],['Needs most attention',low?esc(low.n)+' ('+pc(low.p)+')':'–']])}</div>
 <div class=box><h2>③ Subject-wise distribution</h2>${tb(['Subject','Marks','Out of','Grade','Share of total'],
  sb.map(s=>[subjectLabel(s.n,s.p),s.v==null?'Absent':s.v,s.m,grade(s.p),s.v!=null&&x.t?pc(s.v/x.t):'–']))}
 ${chart(sb.map(s=>s.n),[sb.map(s=>s.p)],['#a02020'],['Student'])}</div>`}

function combView(p){const all=DB[cls],as=p?all:all.filter((a,i)=>on[cls+i]!==false),w=a=>+W[cls+a.name]||1;
 const RS=as.map(calc),names=[...new Set(as.flatMap(a=>a.st.map(s=>s.n)))];
 const rows=names.map(n=>{const ps=RS.map(R=>R.find(r=>r.s.n==n)),num=sum(ps.map((x,j)=>x&&x.p!=null?x.p*w(as[j]):0)),den=sum(ps.map((x,j)=>x&&x.p!=null?w(as[j]):0));return{n,ps,avg:den?num/den:null}});
 const v=rows.filter(r=>r.avg!=null);rows.forEach(r=>{if(r.avg!=null)r.rk=1+v.filter(y=>y.avg>r.avg+1e-9).length});
 const me=rows.find(r=>r.n==sn),ctl=all.map((a,i)=>`<label style="margin-right:14px"><input type=checkbox ${on[cls+i]===false?'':'checked'} onchange="on['${cls+i}']=this.checked;render()"> ${esc(a.name)} weight <input type=number min=0 step=.5 value=${W[cls+a.name]||1} style="width:55px" onchange="W['${cls+a.name}']=this.value;render()"></label>`).join('');
 let h=(p?'':`<div class="box no"><b>Assessments to link:</b> ${ctl}</div>`)+hd('Combined Result ('+as.map(a=>a.name).join(', ')+')',as[0]);
 if(me){const L=as.map(a=>a.name);
  h+=`<div class=box><h2>Student progress – ${esc(sn)}</h2><div class=ks>${kp('Combined %',pc(me.avg),'weighted average')}${kp('Combined position',me.rk?ord(me.rk):'–','of '+v.length)}</div>
  ${tb(['Assessment','Overall %','Class avg %','Position','Percentile','Grade'],as.map((a,j)=>{const x=me.ps[j];return[esc(a.name),pc(x&&x.p),pc(RS[j].avg),x&&x.rank?ord(x.rank)+' of '+RS[j].n:'–',x&&x.pc!=null?ord(Math.round(x.pc*100)):'–',grade(x&&x.p)]}))}
  ${chart(L,[me.ps.map(x=>x&&x.p),RS.map(R=>R.avg)],['#a02020','#a5a5a5'],['Student','Class average'])}</div>`;
  const keys=[...new Set(as.flatMap(a=>a.subs.map(s=>s.n.toLowerCase())))];
  h+=`<div class=box><h2>Subject progress – ${esc(sn)}</h2>${tb(['Subject',...L,'Change'],keys.map(k=>{const ps=as.map(a=>{const i=a.subs.findIndex(s=>s.n.toLowerCase()==k),x=a.st.find(s=>s.n==sn),vv=x&&i>=0?x.k[i]:null;return typeof vv=='number'?vv/a.subs[i].m:null}),f=ps.filter(p=>p!=null),d=f.length>1?(f[f.length-1]-f[0])*100:null;
   return[esc(k[0].toUpperCase()+k.slice(1)),...ps.map(pc),d==null?'–':`<span class="${d>=0?'g':'r'}">${d>=0?'+':''}${d.toFixed(1)} pts</span>`]}))}</div>`}
 if(!p)h+=`<div class=box><h2>Class combined report – ${esc(cls)}</h2>${tb(['Student',...as.map(a=>esc(a.name)),'Combined %','Position'],[...rows].sort((a,b)=>(b.avg??-1)-(a.avg??-1)).map(r=>[esc(r.n),...r.ps.map(x=>pc(x&&x.p)),'<b>'+pc(r.avg)+'</b>',r.rk?ord(r.rk):'–']))}</div>`;return h}

function render(){const cl=Object.keys(DB);$('hl').src=BRAND_LOGO;$('cls').innerHTML=cl.map(c=>`<option ${c==cls?'selected':''}>${esc(c)}</option>`).join('');
 if(!cl.length||view=='home'){$('bar').style.display='none';return home()}$('bar').style.display='';
 if(!DB[cls])cls=cl[0];const as=DB[cls];if(ai>=as.length)ai=as.length-1;
 const names=[...new Set(as.flatMap(a=>a.st.map(s=>s.n)))];if(!names.includes(sn))sn=names[0];
 $('bar').innerHTML=`<button class="${tab=='s'?'on':''}" onclick="tab='s';render()">Monthly dashboards</button> <button class="${tab=='c'?'on':''}" onclick="tab='c';render()">Combined / linked report</button> &nbsp;
 Student: <select onchange="sn=this.value;render()">${names.map(n=>`<option ${n==sn?'selected':''}>${esc(n)}</option>`).join('')}</select>
 ${tab=='s'?` Assessment: <select onchange="ai=+this.value;render()">${as.map((a,i)=>`<option value=${i} ${i==ai?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:''}`;
 $('main').innerHTML=tab=='s'?stuView(as[ai],calc(as[ai])):combView()}

async function parse(wb){const sheet=wb.Sheets[wb.SheetNames[0]],d=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null});
 const numeric=v=>{if(typeof v=='number'&&Number.isFinite(v))return v;if(typeof v=='string'&&/^-?\d+(?:\.\d+)?\s*%?$/.test(v.trim()))return parseFloat(v);return null};
 const label=v=>String(v==null?'':v).trim(),nameHeader=/^(?:(?:student|pupil|learner|candidate|child|person)\s+(?:full\s*)?name|full\s*name|name|student|pupil|candidate)$/i,skip=/^(?:sr\.?(?:\s*(?:no|number)\.?)?|s\.?\s?no\.?|serial(?:\s*(?:no|number)\.?)?|(?:student\s+)?id|roll(?:\s*(?:no|number)\.?)?|rank|position|#)$/i;
 let h=-1,best=-1;
 for(let r=0;r<Math.min(d.length,30);r++){const row=d[r]||[],headers=row.map(label),present=headers.filter(Boolean).length;if(present<2)continue;
  const numericCols=headers.map((x,i)=>x&&!skip.test(x)&&d.slice(r+1,r+101).some(v=>numeric(v&&v[i])!=null)?i:-1).filter(i=>i>=0),hasName=headers.some(x=>nameHeader.test(x));
  const score=numericCols.length*4+present+(hasName?8:0);if(numericCols.length&&score>best){best=score;h=r}}
 if(h<0){h=d.findIndex((r,i)=>i<30&&r&&r.length>1&&d.slice(i+1,i+101).some(v=>v&&v.some(x=>numeric(x)!=null)))}
 if(h<0)throw'No tabular data with numeric values was found in this file';
 const headers=(d[h]||[]).map(label),body=d.slice(h+1),width=Math.max(headers.length,...body.slice(0,100).map(r=>r?r.length:0));
 let nameCol=headers.findIndex(x=>nameHeader.test(x));if(nameCol<0)nameCol=Array.from({length:width},(_,i)=>i).find(i=>!skip.test(headers[i]||'')&&body.some(r=>r&&typeof r[i]=='string'&&r[i].trim()&&numeric(r[i])==null));
 if(nameCol==null||nameCol<0)throw'Could not identify a text column for student names';
 let cols=Array.from({length:width},(_,i)=>i).filter(i=>i!==nameCol&&!skip.test(headers[i]||'')&&body.some(r=>r&&numeric(r[i])!=null));
 if(!cols.length)throw'No numeric measures were found beside the name column';
 const subs=cols.map((i,j)=>{let n=headers[i]||'Measure '+(j+1),cap=n.match(/(?:\/|out\s+of|max(?:imum)?)\s*(\d+(?:\.\d+)?)/i)||n.match(/\((\d+(?:\.\d+)?)\s*(?:marks?)?\)/i),values=body.map(r=>r?numeric(r[i]):null).filter(v=>v!=null),m=cap?parseFloat(cap[1]):Math.ceil(Math.max(...values)/5)*5||Math.max(...values),cleanName=n.replace(/\s*(?:\/|out\s+of|max(?:imum)?)\s*\d+(?:\.\d+)?|\s*\(\d+(?:\.\d+)?\s*(?:marks?)?\)/i,'').replace(/\(\s*\)/g,'').trim();return{n:cleanName||n,m,i}});
 const st=body.map(r=>{const n=label(r&&r[nameCol]),k=subs.map(s=>r?numeric(r[s.i]):null);return n&&!/^%+$/.test(n)&&k.some(v=>v!=null)?{n,k}:null}).filter(Boolean);
 if(!st.length)throw'No student rows with numeric results were found';
 return{cls:String(wb.SheetNames[0]||'Class').trim(),subs:subs.map(({n,m})=>({n,m})),st}}
async function pdfRows(buf){pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';
 const doc=await pdfjsLib.getDocument({data:buf,isEvalSupported:false}).promise,rows=[];
 for(let p=1;p<=doc.numPages;p++){const tc=await(await doc.getPage(p)).getTextContent(),L=[];
  tc.items.forEach(t=>{if(!t.str.trim())return;const y=Math.round(t.transform[5]/3);let r=L.find(l=>l.y==y);if(!r){r={y,c:[]};L.push(r)}r.c.push({x:t.transform[4],w:t.width,s:t.str.trim()})});
  L.sort((a,b)=>b.y-a.y).forEach(l=>{const cs=[];l.c.sort((a,b)=>a.x-b.x).forEach(c=>{const q=cs[cs.length-1];if(q&&c.x-q.e<6){q.s+=' '+c.s;q.e=c.x+c.w}else cs.push({s:c.s,e:c.x+c.w})});rows.push(cs.map(c=>isNaN(c.s)?c.s:+c.s))})}
 return rows}
function logoFromZip(zip){const files=Object.keys(zip.files).filter(n=>!zip.files[n].dir&&/(?:^|\/)(?:media|pictures)\/.*\.(png|jpe?g|gif|webp|bmp)$/i.test(n));
 if(!files.length)return null;files.sort((a,b)=>Number(!/logo/i.test(a))-Number(!/logo/i.test(b)));const n=files[0],x=n.split('.').pop().toLowerCase(),mime={jpg:'jpeg',jpeg:'jpeg',png:'png',gif:'gif',webp:'webp',bmp:'bmp'}[x]||'png';
 return zip.file(n).async('base64').then(b=>'data:image/'+mime+';base64,'+b)}
async function officeLogo(file){const ext=(file.name.split('.').pop()||'').toLowerCase();if(!['docx','xlsx','xlsm','pptx','ods','zip'].includes(ext))return null;return logoFromZip(await JSZip.loadAsync(await file.arrayBuffer()))}
async function fileLogo(file){const ext=(file.name.split('.').pop()||'').toLowerCase(),mime={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp'}[ext];
 if(!mime)return null;return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Could not read the image'));r.readAsDataURL(file)})}
function rowsFromDocx(zip){const entry=zip.file('word/document.xml');if(!entry)throw'No readable document body was found';return entry.async('text').then(xml=>{const doc=new DOMParser().parseFromString(xml,'application/xml'),tables=[...doc.getElementsByTagNameNS('*','tbl')];if(!tables.length)throw'No table was found in the document';return tables.flatMap(t=>[...t.getElementsByTagNameNS('*','tr')].map(tr=>[...tr.getElementsByTagNameNS('*','tc')].map(tc=>[...tc.getElementsByTagNameNS('*','t')].map(n=>n.textContent).join(' ').trim())))})}
function rowsFromMarkup(text){const doc=new DOMParser().parseFromString(text,'text/html'),rows=[...doc.querySelectorAll('tr')].map(tr=>[...tr.querySelectorAll('th,td')].map(c=>c.textContent.trim()));return rows.filter(r=>r.some(Boolean))}
async function load(file){try{const ext=(file.name.split('.').pop()||'').toLowerCase();let wb,logo=await fileLogo(file);
 if(logo){
  const assessments=DB[cls]||[];
  if(assessments.length){const targetName=await ask('Which assessment should use this school logo?',(assessments[ai]||assessments[0]).name);if(!targetName)return;
   const target=assessments.find(a=>a.name==targetName);if(!target)throw'No assessment named "'+targetName+'" was found in '+cls;target.logo=logo;save()}
  else{LOGOS[cls||'default']=logo;localStorage.setItem('md-logos',JSON.stringify(LOGOS))}
  render();toast('School logo saved for '+(cls||'your next assessment'));return}
 if(ext=='json'){const j=JSON.parse(await file.text());
  if(Array.isArray(j)||Array.isArray(j.data))wb={SheetNames:['Class'],Sheets:{Class:XLSX.utils.json_to_sheet(Array.isArray(j)?j:j.data)}};
  else if(Object.values(j).every(v=>Array.isArray(v)&&v.every(a=>a.st&&a.subs))){DB=j;cls=Object.keys(DB)[0];view='app';save();return render()}
  else wb={SheetNames:['Class'],Sheets:{Class:XLSX.utils.json_to_sheet([j])}}
 }else if(ext=='pdf')wb={SheetNames:['Class'],Sheets:{Class:XLSX.utils.aoa_to_sheet(await pdfRows(await file.arrayBuffer()))}};
 else if(ext=='docx'){const zip=await JSZip.loadAsync(await file.arrayBuffer());logo=await logoFromZip(zip);wb={SheetNames:['Class'],Sheets:{Class:XLSX.utils.aoa_to_sheet(await rowsFromDocx(zip))}}}
 else if(['html','htm'].includes(ext)){const rows=rowsFromMarkup(await file.text());if(!rows.length)throw'No data table was found in this document';wb={SheetNames:['Class'],Sheets:{Class:XLSX.utils.aoa_to_sheet(rows)}}}
 else if(['csv','tsv','txt','md','xml'].includes(ext)){let text=await file.text();if(ext=='md')text=text.split(/\r?\n/).filter(l=>l.includes('|')&&!/^\s*\|?[\s:|-]+\|?\s*$/.test(l)).map(l=>l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(v=>v.trim())).map(r=>r.join('\t')).join('\n');wb=XLSX.read(text,{type:'string',FS:ext=='tsv'?'\t':undefined})}
 else wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
 if(!logo)logo=await officeLogo(file);
 const p=await parse(wb);if(/^sheet\d*$/i.test(p.cls))p.cls='Class';
 
 const nm=((await ask('Name this assessment (e.g. September, November):',file.name.replace(/\.\w+$/,'').replace(/[_-]/g,' ')))||'').trim();if(!nm)return;
 const c=(await ask('Class name:',p.cls))||p.cls;(DB[c]=DB[c]||[]);const i=DB[c].findIndex(a=>a.name==nm),previous=i>=0?DB[c][i]:null,a={name:nm,subs:p.subs,st:p.st,logo:logo||(previous&&previous.logo)||LOGOS[c]||LOGOS.default};
 if(i>=0)DB[c][i]=a;else DB[c].push(a);cls=c;ai=DB[c].findIndex(a=>a.name==nm);tab='s';view='app';save();render();toast('Imported "'+nm+'" - '+a.st.length+' records. Use "Download all PDFs" when you want PDFs')}catch(e){alert('Import failed: '+(e&&e.message||e))}}
function del(){if(cls&&DB[cls]&&confirm('Delete "'+DB[cls][ai].name+'" from '+cls+'?')){DB[cls].splice(ai,1);if(!DB[cls].length)delete DB[cls];cls=Object.keys(DB)[0];ai=0;save();render()}}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='result_dashboards_backup.json';a.click()}
$('f').onchange=e=>{[...e.target.files].forEach(load);e.target.value=''};
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drop')});
addEventListener('dragleave',()=>document.body.classList.remove('drop'));
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drop');[...e.dataTransfer.files].forEach(load)});
render();
